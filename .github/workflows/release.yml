name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build Release Artifacts (APKs & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification tests
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Per-ABI Split Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Google Play App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Prepare Release Artifacts & Generate Checksums
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/kairos-universal-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/kairos-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/kairos-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/kairos-x86_64-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/kairos-release.aab
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: Kairos ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
