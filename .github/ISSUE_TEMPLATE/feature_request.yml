name: Feature Request
description: Suggest an idea or enhancement for Kairos
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for Kairos! We appreciate ideas that enhance clarity, calm, and utility.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or user experience you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or design references that illustrate your proposal.
